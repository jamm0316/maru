<main id="main">
<section class="hero" id="top">
  <div class="wrap">
    <p class="eyebrow mono" data-i18n="hero.eyebrow"></p>
    <h1 class="display"><span data-i18n="hero.h1a"></span> <span class="line2" data-i18n="hero.h1b"></span></h1>
    <p class="lede" data-i18n="hero.sub"></p>
    <div class="actions">
      <a class="btn btn-primary" data-link="download" data-i18n="hero.download"></a>
      <a class="btn btn-ghost" data-link="github" data-i18n="hero.github"></a>
    </div>
    <div class="try" aria-hidden="true"><span class="try-pr">&gt;</span><span class="try-line"><span class="try-name" data-i18n="try.name"></span> <span class="try-text" id="try-text"></span><span class="try-cur"></span></span></div>
    <p class="sr-only" data-i18n="try.sr"></p>
    <p class="small" data-i18n="hero.small"></p>
    <noscript><div class="noscript"><p><strong>Many agents. One conversation.</strong></p><p>Maru is a chief of staff for your agents. It hands the work out, remembers who did what, and answers you as one.</p><p class="mono">macOS 15 or later · Apple Silicon · Claude Code installed · a Claude subscription</p></div></noscript>
  </div>
  <div class="wrap wrap-wide">
    <figure class="film">
      <div class="film-frame" id="film">
        <div class="film-ph" aria-hidden="true">
          <img src="assets/logo.svg" alt="" width="72" height="72">
          <span data-i18n="video.placeholder"></span>

        <button type="button" class="film-btn" id="film-btn" aria-pressed="false" disabled>

          <span id="film-btn-t" data-i18n="video.pause"></span>

</section>

</section>

  <div class="wrap">

        <span class="mem-node" aria-hidden="true"></span>

        <span class="mem-node" aria-hidden="true"></span>

          <p data-i18n="s2.today.body"></p>
        </div>
      </div>

        <span class="mem-moon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>

      </div>

        <span class="mem-node mem-node-solid" aria-hidden="true"></span>
        <div class="mem-card mem-card-good">
          <span class="mono tag" data-i18n="s2.good.tag"></span>

          <p data-i18n="s2.good.body"></p>

            <li class="m-child"><span class="m-dot"></span><span data-i18n="s3.a.child"></span><span class="m-st" data-i18n="s3.a.st"></span></li>
          </ul>
          <div class="m-card"><p class="m-ans" data-i18n="s3.a.reply"></p></div>
        </div>
      </div>

    <article class="feat reveal">

    <article class="feat reveal">
      <div class="feat-text">
        <h3 data-i18n="s3.c.t"></h3>
        <p data-i18n="s3.c.b"></p>
      </div>
      <div class="mock" aria-hidden="true">
        <div class="mock-bar"><i></i><i></i><i></i></div>
        <div class="mock-body m-cols">
          <div class="m-col">

              <li><span data-i18n="s3.c.p1"></span><span class="m-chip" data-i18n="s3.c.p1n"></span></li>
              <li><span data-i18n="s3.c.p2"></span><span class="m-chip" data-i18n="s3.c.p2n"></span></li>

            <span class="m-chip m-chip-or" data-i18n="s3.d.kind"></span>

    <p class="foot mock-note" data-i18n="mock.note"></p>
